appId: com.bobguillow.perfumepicks
---
# M1 ACCEPTANCE (picker-as-first-screen reality): grid -> "Read my Fragrance DNA"
# -> reading -> reveal. The refine ("ALMOST THERE") screen must be GONE.
- launchApp
- extendedWaitUntil:
    visible:
      id: "dna-picker-grid"
    timeout: 30000
- takeScreenshot: m1-01-grid
# Pick three tiles by relative position (row 1).
- tapOn:
    point: "18%,33%"
- waitForAnimationToEnd
- tapOn:
    point: "50%,33%"
- waitForAnimationToEnd
- tapOn:
    point: "82%,33%"
- waitForAnimationToEnd
- takeScreenshot: m1-02-picked
# CTA must now read "Read my Fragrance DNA" (was "Continue with N").
- assertVisible:
    text: ".*Read my Fragrance DNA.*"
- tapOn:
    id: "dna-picker-continue"
- waitForAnimationToEnd
# The refine screen must NOT appear.
- assertNotVisible: "ALMOST THERE"
- extendedWaitUntil:
    visible:
      text: ".*FRAGRANCE DNA.*"
    timeout: 30000
- takeScreenshot: m1-03-reveal
