# M9 gate: Wardrobe Strategy + Completion on the Wardrobe tab.
#
# Proves the DNA-driven Wardrobe Strategy card surfaces on the Wardrobe tab after
# onboarding. NOTE (v1.1): the picker spine seeds the wardrobe — picked tiles
# default to relation 'own' (app/dna/index.tsx) and are added as "have", so a
# guest who completes the picker lands with 3 owned bottles, NOT a cold-start 0.
# Invariants under that seeded reality:
#   1. The Wardrobe Strategy card (testID wardrobe-strategy) renders — the M9
#      deliverable, the DNA's "complete your collection" surface.
#   2. The completion coverage row (testID wardrobe-completion) IS visible, because
#      onboarding seeds owned ≥ COMPLETION_FLOOR (3). (The biggest-gap action is
#      now data-dependent — it only renders when a slot is actually empty — so it
#      is no longer a stable cold-start invariant and is not asserted here.)
appId: com.bobguillow.perfumepicks
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: "http://localhost:8081"
    commands:
      - tapOn:
          text: "http://localhost:8081"
- extendedWaitUntil:
    visible:
      text: "__sleep_for_bundle__"
    timeout: 25000
    optional: true
- tapOn:
    point: "91%,50%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Continue as Guest"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        text: "Continue as Guest"
    commands:
      - tapOn:
          text: "Continue as Guest"

# ── Picker spine → app ──
- extendedWaitUntil:
    visible:
      id: "dna-picker-grid"
    timeout: 90000
- tapOn: { id: "dna-tile", index: 0 }
- tapOn: { id: "dna-tile", index: 1 }
- tapOn: { id: "dna-tile", index: 2 }
- tapOn: { id: "dna-tile-favorite", index: 0 }
- tapOn: { id: "dna-picker-continue" }
- extendedWaitUntil:
    visible:
      id: "dna-refine-continue"
    timeout: 15000
- tapOn: { id: "dna-refine-continue" }
- extendedWaitUntil:
    visible:
      id: "dna-reveal-archetype"
    timeout: 20000
- tapOn: { id: "dna-reveal-continue" }
- extendedWaitUntil:
    visible:
      id: "dna-first-rec"
    timeout: 15000
- tapOn: { id: "dna-rec-skip" }
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 20000

# ── Go to the Wardrobe tab ──
- tapOn: { id: "tab-wardrobe" }
- extendedWaitUntil:
    visible:
      id: "wardrobe-strategy"
    timeout: 15000

# ── Seeded wardrobe (3 owned from the picker): coverage row IS shown ──
- assertVisible:
    id: "wardrobe-completion"
