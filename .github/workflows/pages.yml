name: Deploy Pages

# Trigger on every push to main. Workflow-based deploy bypasses the
# legacy GitHub Pages build queue, which got stuck on first build for
# this brand-new repo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; let in-progress runs finish before
# starting a new one so a fast-fire of commits doesn't pile up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The Astro site is pre-built and committed to /docs (the same
      # path the legacy build was using). No npm install required —
      # we're just serving static files.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      # GitHub's Pages API intermittently returns a generic
      # "Deployment failed, try again later" that clears on a retry — it is a
      # platform-side blip, not a build error (the artifact is already uploaded
      # by this point). Attempt the deploy, and if it fails transiently, wait
      # and retry once. Only if BOTH attempts fail does the run go red, so real
      # breakage still surfaces while transient noise self-heals.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
