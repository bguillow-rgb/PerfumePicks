# Smoke: Today -> Taste tab routes straight into the swipe session (no "Begin a
# Session" interstitial); its signature surface is the "TASTE SESSION" header.
appId: com.bobguillow.perfumepicks
---
- launchApp
- runFlow: helpers/dismiss_dev_menu.yaml
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 90000
# Warmup tap absorbs the cold-process dropped-first-interaction race.
- tapOn:
    id: "tab-today"
- waitForAnimationToEnd
- tapOn:
    id: "tab-taste"
- extendedWaitUntil:
    visible:
      text: "TASTE SESSION"
    timeout: 15000
