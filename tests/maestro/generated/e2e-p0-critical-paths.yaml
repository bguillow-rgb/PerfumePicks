appId: com.bobguillow.perfumepicks
---
# ══════════════════════════════════════════════════════════════════
# PerfumePicks E2E P0 Critical Path Suite
# Covers: FTUE, all 5 tabs, Discover search/filter, Taste intro,
#         Wardrobe empty state + filter pills, Profile sections,
#         navigation between tabs, empty states, no crashes.
# Guest user (anonymous sign-in). No Supabase data.
#
# SETUP NOTES (dev client quirks on iOS 26):
# - launchApp cold-starts the Expo dev client, which may show:
#   a) Dev client home screen (server picker) if state was cleared
#   b) "Open in Perfume Picks?" system dialog (accessibilityText only)
#   c) First-launch dev menu overlay ("Continue" button)
#   d) Dev tools menu (Close button — label tap broken, use coord)
# - All tapOn with label: match accessibilityText (not text field)
# - optional: true silently skips if element not present
# ══════════════════════════════════════════════════════════════════

- launchApp
- waitForAnimationToEnd

# ── Step 1: Handle Expo dev client server picker ───────────────────
# If clearState was run the app forgets the bundle URL and shows the
# picker. Tap the server row by label (accessibilityText = URL text).
- tapOn:
    label: "http://localhost:8083"
    optional: true
- waitForAnimationToEnd

# ── Step 2: Handle "Open in 'Perfume Picks'?" system dialogs ───────
# These appear when the dev client calls Linking.openURL with the
# perfumepicks:// scheme. Tap Open (not Cancel) to connect to Metro.
# Use optional: true — silently skips when no dialog is present.
- tapOn:
    label: "Open"
    optional: true
- waitForAnimationToEnd
- tapOn:
    label: "Open"
    optional: true
- waitForAnimationToEnd
- tapOn:
    label: "Open"
    optional: true
- waitForAnimationToEnd

# ── Step 3: Handle first-time dev menu overlay ("Continue") ────────
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

# ── Step 4: Close dev tools menu if it opened ──────────────────────
# The "Close" button has accessibilityText: "Close" but label tap
# doesn't dismiss it. Use coordinate tap at its center [344,401][378,436]
# = ~90%, 48%. Harmless tap on login/home screen (empty space).
- tapOn:
    point: "90%, 48%"
- waitForAnimationToEnd

# ── Step 5: Sign in as guest ───────────────────────────────────────
- runFlow:
    when:
      visible: "Continue as Guest"
    commands:
      - tapOn: "Continue as Guest"

# ── Wait for home screen ───────────────────────────────────────────
- extendedWaitUntil:
    visible: "SCENT OF THE DAY"
    timeout: 60000

# ── CP1: Home Tab / Today (TC-170, TC-121, TC-123, TC-174) ─────────
- assertVisible: "SCENT OF THE DAY"
- takeScreenshot: e2e-01-home-top

# Scroll to verify all rails render
- scroll
- takeScreenshot: e2e-02-home-rails
- scroll
- takeScreenshot: e2e-03-home-bottom

# ── CP2: Discover Tab (TC-178, TC-188, TC-193) ─────────────────────
- tapOn: "Discover, tab, 2 of 6"
- extendedWaitUntil:
    visible: "Search fragrances, notes, brands..."
    timeout: 15000
- assertVisible: "CURATED EDITS"
- takeScreenshot: e2e-04-discover-top

- scroll
- assertVisible: "BY ACCORD"
- takeScreenshot: e2e-05-discover-accords
- scroll
- takeScreenshot: e2e-06-discover-bottom

# ── CP3: Taste/Train Tab (TC-196, TC-209) ──────────────────────────
- tapOn: "Taste, tab, 3 of 6"
- extendedWaitUntil:
    visible: "TRAIN MY NOSE"
    timeout: 15000
- assertVisible: "Begin a Session"
- takeScreenshot: e2e-07-taste-intro

# ── CP4: Wardrobe Tab Empty State (TC-212, TC-213) ─────────────────
- tapOn: "Wardrobe, tab, 4 of 6"
- extendedWaitUntil:
    visible: "Start your collection"
    timeout: 15000
- assertVisible: "Browse Fragrances"
- assertVisible: "All"
- assertVisible: "Want"
- assertVisible: "Have"
- assertVisible: "Tried"
- takeScreenshot: e2e-08-wardrobe-empty

# ── CP5: Profile Tab (TC-235, TC-236, TC-251) ──────────────────────
- tapOn: "You, tab, 6 of 6"
- extendedWaitUntil:
    visible: "Taste Profile"
    timeout: 15000
- takeScreenshot: e2e-09-profile-top
- scroll
- takeScreenshot: e2e-10-profile-bottom
