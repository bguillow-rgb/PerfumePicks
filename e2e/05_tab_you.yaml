# Smoke: Today -> You tab renders the profile (account, subscription, taste
# profile summary).
appId: com.bobguillow.perfumepicks
---
- launchApp
- runFlow: helpers/dismiss_dev_menu.yaml
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 90000
- tapOn:
    id: "tab-today"
- waitForAnimationToEnd
- tapOn:
    id: "tab-profile"
# The You tab's signature top surface is the re-viewable My Fragrance DNA card.
- extendedWaitUntil:
    visible:
      id: "my-dna-card"
    timeout: 15000
# It is a long scroll list; the Account rows live below the fold. Section titles
# render uppercase via CSS but the underlying text nodes are title-case, so
# assert the literal row label ("Subscription"), not the styled header.
- scrollUntilVisible:
    element:
      text: "Subscription"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Subscription"
