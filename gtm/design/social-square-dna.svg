  <rect x="60" y="60" width="960" height="960" fill="none" stroke="#B8924B" stroke-width="3"/>
  <rect x="74" y="74" width="932" height="932" fill="none" stroke="#E6DCCB" stroke-width="1.5"/>

  <!-- top kicker -->
  <text x="540" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#7A6A5C" letter-spacing="8">PERFUME PICKS</text>
  <line x1="430" y1="232" x2="650" y2="232" stroke="#B8924B" stroke-width="1.5"/>

  <!-- emblem -->
  <g transform="translate(540,400)" stroke="#B8924B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-22" y="-96" width="44" height="26" rx="5" fill="#B8924B"/>
    <rect x="-12" y="-72" width="24" height="16"/>
    <rect x="-50" y="-58" width="100" height="132" rx="21"/>
    <line x1="-50" y1="-2" x2="50" y2="-2"/>
