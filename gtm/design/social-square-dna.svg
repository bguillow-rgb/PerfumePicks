  <g font-family="Georgia, serif" font-size="26" fill="#B8924B" text-anchor="middle">
    <rect x="250" y="860" width="240" height="58" rx="29" fill="none" stroke="#E6DCCB" stroke-width="2"/>
    <text x="370" y="898">The Connoisseur</text>
    <rect x="590" y="860" width="200" height="58" rx="29" fill="none" stroke="#E6DCCB" stroke-width="2"/>
    <text x="690" y="898">The Seducer</text>
    <rect x="340" y="934" width="180" height="58" rx="29" fill="none" stroke="#E6DCCB" stroke-width="2"/>
    <text x="430" y="972">The Purist</text>
    <rect x="540" y="934" width="220" height="58" rx="29" fill="none" stroke="#E6DCCB" stroke-width="2"/>
