appId: com.bobguillow.perfumepicks
---
# CHECKOUT 2.0 E2E (plans/PRD-checkout-2.0.md §10) — proves the buy handoff end
# to end from the app side: reach a perfumania-buyable fragrance, tap Buy, and
# confirm the in-app browser sheet opens and the app survives the round-trip.
#
# HONEST SCOPE: Maestro cannot read inside SFSafariViewController (system view),
# so WHICH url opened (checkout vs product) is asserted by the unit tests on
# handleAffiliateClick (__tests__/lib/checkout2.test.ts) + the `landing` property
# on affiliate_outbound_clicked. This flow proves the user-visible journey:
# detail → Buy tap → browser sheet → back → app intact. Run it twice around the
# flag flip (checkout_2_enabled off, then on): the journey must look identical.
#
# Requires Supabase configured (.env.local + Metro restarted) so real retailer
# links load; guest session boots to Home (same preconditions as
# dna-v2-m2-buyable.yaml).
- launchApp
- tapOn:
    text: "http://localhost:8081"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
# Home is up.
- extendedWaitUntil:
    visible:
      id: "today-dna-retake"
    timeout: 30000
- takeScreenshot: c2-01-home
# Discover → search for a known perfumania-buyable fragrance.
- tapOn:
    text: "Discover"
- waitForAnimationToEnd
- takeScreenshot: c2-02-discover
- tapOn:
    id: "discover-search-input"
    optional: true
- tapOn:
    text: "Search.*"
    optional: true
- inputText: "cuba red"
- waitForAnimationToEnd
- takeScreenshot: c2-03-search
# Open the first matching result.
- tapOn:
    text: ".*Red.*"
- waitForAnimationToEnd
# Detail page: the buy CTA must show retailer + price (retailer links loaded).
- extendedWaitUntil:
    visible:
      text: "Buy from perfumania.*"
    timeout: 20000
- takeScreenshot: c2-04-detail-buy-cta
# THE HANDOFF: tap Buy → expo-web-browser opens the (checkout|product) URL in
# an in-app Safari sheet.
- tapOn:
    text: "Buy from perfumania.*"
- waitForAnimationToEnd
# The Safari sheet is a system view; its "Done" chrome is the one element we
# can reliably see. Screenshot proves the sheet is up (perfumania content).
- extendedWaitUntil:
    visible:
      text: "Done"
    timeout: 20000
- takeScreenshot: c2-05-browser-sheet
# Round trip: close the sheet, land back on the intact detail page.
- tapOn:
    text: "Done"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Buy from perfumania.*"
    timeout: 15000
- takeScreenshot: c2-06-back-on-detail
