  </g>

  <!-- headline -->
  <text x="540" y="630" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#2A1F18">What's your</text>
  <text x="540" y="720" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#2A1F18">Fragrance DNA?</text>

  <!-- subline -->
  <text x="540" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#7A6A5C" font-style="italic">One of 11 archetypes. Your taste, named.</text>

