appId: host.exp.Exponent
---
# Back out of the fragrance detail, then open the Profile tab — the screen the
# audit reported double-fetching. Now backed by the shared auth store.
- tapOn:
    point: "8%,6%"
- takeScreenshot: profile__after-back
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Account"
    timeout: 20000
- takeScreenshot: shared-auth__profile
- scrollUntilVisible:
    element:
      text: "About"
    direction: DOWN
    timeout: 10000
    optional: true
- takeScreenshot: shared-auth__profile-scrolled
