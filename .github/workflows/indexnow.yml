name: IndexNow ping

# After new content ships to /docs (GitHub Pages), submit the site's URLs to
# IndexNow so Bing/Yandex/etc. re-crawl quickly. Google ignores IndexNow, but
# Bing feeds ChatGPT/Copilot, so this matters for answer-engine visibility.
# Builds first to populate dist/sitemap-0.xml, then pings. The key file at
# public/<KEY>.txt must already be live (it ships with /docs).
# The workflow_run trigger exists because daily-content.yml pushes with the
# default GITHUB_TOKEN, and GitHub will not fire `on: push` workflows for those
# pushes. Without it this job only ran on human commits. Do not remove.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_run:
    workflows: ["Daily SEO content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    # workflow_run fires on completion regardless of outcome; only ping when the
    # content run succeeded. Push and manual runs are unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (populates dist/sitemap-0.xml)
        run: npm run build

      - name: Ping IndexNow
        # The IndexNow key is public by design (it's served at
        # public/<KEY>.txt), so it lives here as a literal, not a secret.
        env:
          PUBLIC_INDEXNOW_KEY: 6459c4aceebc6ca8fcb832a1df09ad12
        run: bash scripts/indexnow-ping.sh || true
