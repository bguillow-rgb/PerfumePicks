appId: com.bobguillow.perfumepicks
---
# P1: Brand page opens from Discover "BY HOUSE" grid and back-nav works.
- launchApp
- tapOn:
    text: "http://localhost:8081"
    optional: true
- extendedWaitUntil:
    visible: "SCENT OF THE DAY"
    timeout: 60000
- tapOn:
    text: "Discover, tab.*"
- assertVisible: "BY HOUSE"
- takeScreenshot: 010-brand__house-grid
# Tap a house tile. House set is dynamic; Lattafa is the largest house (verified).
- tapOn:
    text: "lattafa"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 010-brand__page
- back
- waitForAnimationToEnd
- takeScreenshot: 010-brand__back-to-discover
