<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F0E6"/>
      <stop offset="1" stop-color="#EADDC9"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2418"/>
      <stop offset="1" stop-color="#1B0C04"/>
    </linearGradient>
    <linearGradient id="liquid1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4788A"/>
      <stop offset="1" stop-color="#8E3A52"/>
    </linearGradient>
    <linearGradient id="cap1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C878"/>
      <stop offset="1" stop-color="#A77F36"/>
    </linearGradient>
    <clipPath id="bodyclip1"><rect x="350" y="356" width="324" height="438" rx="46"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg1)"/>
  <!-- neck -->
  <rect x="456" y="286" width="112" height="86" rx="6" fill="url(#glass1)"/>
  <!-- cap -->
  <rect x="470" y="190" width="84" height="104" rx="16" fill="url(#cap1)"/>
  <!-- body -->
  <rect x="350" y="356" width="324" height="438" rx="46" fill="url(#glass1)"/>
  <!-- liquid (clipped to body) -->
  <g clip-path="url(#bodyclip1)">
    <rect x="350" y="566" width="324" height="228" fill="url(#liquid1)"/>
    <rect x="350" y="560" width="324" height="12" fill="#D98FA0"/>
  </g>
  <!-- gold rim -->
  <rect x="350" y="356" width="324" height="438" rx="46" fill="none" stroke="#D4B179" stroke-width="7"/>
  <!-- label line -->
  <line x1="412" y1="470" x2="612" y2="470" stroke="#D4B179" stroke-width="5" opacity="0.8"/>
</svg>
