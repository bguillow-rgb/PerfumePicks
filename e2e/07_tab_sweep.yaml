# Smoke: full tab-bar regression — sweep all five tabs in one session and
# confirm each renders its signature surface, then return to Today.
appId: com.bobguillow.perfumepicks
---
- launchApp
- runFlow: helpers/dismiss_dev_menu.yaml
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 90000
# Onboarded guest has a live DNA → unified DNA hero card is Today's signature surface.
- assertVisible:
    id: "today-unified-dna"
- tapOn:
    id: "tab-today"
- waitForAnimationToEnd
- tapOn:
    id: "tab-discover"
- extendedWaitUntil:
    visible:
      text: "BY HOUSE"
    timeout: 15000
- tapOn:
    id: "tab-taste"
- extendedWaitUntil:
    visible:
      text: "TASTE SESSION"
    timeout: 15000
- tapOn:
    id: "tab-wardrobe"
- extendedWaitUntil:
    visible:
      text: "Have"
    timeout: 15000
- tapOn:
    id: "tab-profile"
# The profile (You) tab's signature top surface is the re-viewable My Fragrance
# DNA card; the "Account" section sits far below the fold.
- extendedWaitUntil:
    visible:
      id: "my-dna-card"
    timeout: 15000
- tapOn:
    id: "tab-today"
- extendedWaitUntil:
    visible:
      id: "today-unified-dna"
    timeout: 15000
